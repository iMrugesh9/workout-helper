      --ink: #F7F3EE;
      --ink2: #B5ACA1;
      --ink3: #7D746A;
      --accent: #E05338;
      --accent-glow: rgba(224, 83, 56, 0.25);
      --accent-soft: rgba(224, 83, 56, 0.12);
      --done: #4EAD71;
      --done-soft: rgba(78, 173, 113, 0.15);
      --font-display: "Barlow Condensed", "Arial Narrow", -apple-system, sans-serif;
      --font-body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    html { -webkit-text-size-adjust: 100%; background: var(--bg); scroll-behavior: smooth; }

      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    header.hero {
      padding: 40px 0 24px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .badge-hub {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-glow);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .stats-summary {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--ink3);
    }
    .stats-summary b { color: var(--ink); font-weight: 600; }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(34px, 7vw, 54px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.01em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .hero-sub {
      color: var(--ink2);
      font-size: 16px;
      max-width: 600px;
    }

    /* Controls: Search & Filters */
    .controls {
      margin: 24px 0 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .search-box {
      position: relative;
    }
    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink3);
      width: 18px;
      height: 18px;
      pointer-events: none;

    .search-input {

      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: var(--ink);

      color: var(--ink3);

      -webkit-box-orient: vertical;
      overflow: hidden;

      gap: 6px;
      margin-bottom: 16px;
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;

    .c-stat-val {

      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;

    .c-stat-lbl {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--ink3);
      margin-top: 3px;

    .card-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 18px;
    }
    .eq-chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--surface3);
      color: var(--ink2);
    }
    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-start {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 12px;
      border-radius: 10px;
      transition: background .15s ease;

    .btn-start:hover { background: #f0644a; }
    .btn-source {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink3);
      transition: all .15s;
    }
    .btn-source:hover {
      color: var(--ink);
      border-color: var(--line2);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink3);
      grid-column: 1 / -1;

      .hero-top { flex-direction: column; align-items: flex-start; }
      .workout-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

let activeCategory = 'all';
let searchQuery = '';

function renderWorkouts() {
  const grid = document.getElementById('grid');
  const query = searchQuery.trim().toLowerCase();

  const filtered = WORKOUTS.filter(w => {
    // Category match
    if (activeCategory !== 'all' && (!w.category || !w.category.toLowerCase().includes(activeCategory.toLowerCase()))) {
      return false;
    }
    // Search match
    if (query) {
      const text = [
        w.title || '',
        w.description || '',
        w.category || '',
        w.difficulty || '',
        ...(w.equipment || []),
        ...(w.exercises || []).map(e => e.title + ' ' + (e.target_muscles || []).join(' '))
      ].join(' ').toLowerCase();
      if (!text.includes(query)) return false;
    }
    return true;
  });

  document.getElementById('stat-count').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <h3>No workouts found</h3>
        <p style="margin-top:6px;font-size:14px;">Try searching for a different exercise or clear the filter.</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(w => {
    const duration = w.estimated_duration || '20-30m';
    const exCount = (w.exercises || []).length;
    const blocks = w.blocks_count || '1 Circuit';
    const chipsHtml = (w.equipment || []).slice(0, 3).map(eq => `<span class="eq-chip">${eq}</span>`).join('');
    const pageUrl = `workouts/${w.id}.html`;

    return `
      <article class="card">
        <div class="card-top">
          <span class="card-category">${w.category || 'General'}</span>
          <span class="card-diff">${w.difficulty || 'All Levels'}</span>
        </div>
        <div class="card-body">
          <h2 class="card-title">${w.title}</h2>
          <p class="card-desc">${w.description || 'Interactive guided session with video clips and rest timers.'}</p>
          
          <div class="card-stats">
            <div><div class="c-stat-val">${duration}</div><div class="c-stat-lbl">Duration</div></div>
            <div><div class="c-stat-val">${exCount}</div><div class="c-stat-lbl">Exercises</div></div>
            <div><div class="c-stat-val">${blocks}</div><div class="c-stat-lbl">Blocks</div></div>
          </div>

          <div class="card-chips">
            ${chipsHtml}
          </div>

          <div class="card-footer">
            <a href="${pageUrl}" class="btn-start">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Start Workout
            </a>
            ${w.source_url ? `
              <a href="${w.source_url}" target="_blank" rel="noopener" class="btn-source" title="View Source Video">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            ` : ''}
          </div>
        </div>
      </article>
    `;
  }).join('');
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    renderWorkouts();
  });
});

// Search input
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderWorkouts();
});

renderWorkouts();
</script>
