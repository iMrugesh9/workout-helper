<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#E05338" />
      <stop offset="100%" stop-color="#C23616" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="256" height="256" rx="56" fill="url(#bg)" />
  
  <!-- Dumbbell & Lightning Icon -->
  <g filter="url(#shadow)" transform="translate(38, 38)">
    <!-- Dumbbell Bar -->
    <rect x="40" y="82" width="100" height="16" rx="8" fill="#FFFFFF" />
    <!-- Center Grip Rings -->
    <rect x="75" y="78" width="8" height="24" rx="3" fill="#FFFFFF" opacity="0.8" />
    <rect x="97" y="78" width="8" height="24" rx="3" fill="#FFFFFF" opacity="0.8" />
    <!-- Inner Plates Left -->
    <rect x="30" y="60" width="14" height="60" rx="6" fill="#FFFFFF" />
    <!-- Outer Plates Left -->
    <rect x="12" y="68" width="14" height="44" rx="5" fill="#FFFFFF" opacity="0.9" />
    <!-- Inner Plates Right -->
    <rect x="136" y="60" width="14" height="60" rx="6" fill="#FFFFFF" />
    <!-- Outer Plates Right -->
    <rect x="154" y="68" width="14" height="44" rx="5" fill="#FFFFFF" opacity="0.9" />
    <!-- High Energy Lightning Bolt Accent -->
    <polygon points="98,24 64,88 88,88 78,146 122,76 96,76" fill="url(#boltGrad)" />
  </g>
</svg>
